services:
  - type: web
    name: newtonite-ops
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: ''
      - key: OUTBOX_POLL_INTERVAL_MS
        value: '3000'
