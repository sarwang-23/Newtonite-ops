version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: newtonite-ops-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: newtonite_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d newtonite_ops"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newtonite-ops-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/newtonite_ops
      JWT_SECRET: newtonite-ops-secure-jwt-production-secret-2026
      OUTBOX_POLL_INTERVAL_MS: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
